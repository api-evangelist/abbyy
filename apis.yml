- aid: abbyy:abbyy-vantage-reporting
  name: ABBYY Vantage Reporting API
  description: Reporting REST API for ABBYY Vantage. Downloads CSV extracts from the Business Processing Reporting
    Warehouse (transaction-level step timings, skill versions, reviewer detail) and the Analytics Reporting Warehouse
    (document and field changes made during Manual Review). Restricted to Tenant Administrator and Processing Supervisor
    roles. v2 is current; v1 remains published alongside it.
  humanURL: https://docs.abbyy.com/vantage/developer/reporting/reporting-service
  baseURL: https://vantage-us.abbyy.com
