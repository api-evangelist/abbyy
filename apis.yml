- aid: abbyy:abbyy-docs-mcp
  name: ABBYY Documentation MCP Server
  description: >-
    Hosted, unauthenticated Model Context Protocol server over the public ABBYY documentation corpus.
    Exposes semantic search, a read-only virtual documentation filesystem, and a feedback tool, plus an
    MCP resource carrying ABBYY’s published Agent Skill. Read-only: it does not reach a Vantage tenant
    or process documents.
  humanURL: https://docs.abbyy.com/vantage/developer/mcp-server
  baseURL: https://docs.abbyy.com/mcp
  tags:
