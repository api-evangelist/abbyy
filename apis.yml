aid: abbyy
name: ABBYY
description: ABBYY is an intelligent document processing (IDP) and process intelligence company whose platform classifies
  documents, extracts structured data with confidence scores, and orchestrates human-in-the-loop review. ABBYY Vantage
  exposes two public REST APIs — a Processing API for transactions, documents, skills and data catalogs, and a Reporting
  API for business and analytics warehouse exports — both authenticated with OAuth 2.0 and served from regional
  US, EU and AU hosts. ABBYY also ships FlexiCapture Cloud for Invoices as a separate Basic-auth REST API, mobile
  capture SDKs, RPA connectors for UiPath, Power Automate, Pega, Blue Prism and Automation Anywhere, a hosted documentation
  MCP server, and a published A2A agent card.
