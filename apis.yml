- aid: abbyy:abbyy-flexicapture-invoices
  name: ABBYY FlexiCapture Cloud for Invoices API
  description: REST API for ABBYY FlexiCapture Cloud for Invoices. Uploads files, runs invoice capture tasks, downloads
    results, and maintains business-unit and vendor master-data sets plus model training. HTTP Basic auth using
    an application id and token. Regional endpoints api-us / api-eu / api-au .flexicapture.com. ABBYY states the
    FlexiCapture Cloud web portal publishes the API scheme in Swagger format, but that scheme sits behind the portal
    login and no anonymous OpenAPI document was retrievable.
  humanURL: https://docs.abbyy.com/flexi-capture/cloud/cloud-f-cfor-invoices-api
  baseURL: https://api-us.flexicapture.com
