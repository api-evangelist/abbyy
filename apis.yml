- aid: abbyy:abbyy-vantage-processing
  name: ABBYY Vantage Processing REST API
  description: Public REST API for ABBYY Vantage intelligent document processing. Create transactions, upload and
    order files, launch AI skills for classification, extraction and OCR, poll transaction status, download extracted
    JSON/XML results, generate mobile-input links, and manage data catalogs and their records. OAuth 2.0 authorization-code
    flow against the tenant auth server; 30 operations across six resource groups.
  humanURL: https://docs.abbyy.com/vantage/developer/api-introduction
