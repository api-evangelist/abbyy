description: >-
  ABBYY publishes no plans, no prices and no quotas for any of its APIs. There is no pricing page on
  abbyy.com — /pricing/, /vantage/pricing/ and /solutions/pricing/ all return 404 — and the developer API
  landing page ends at "Contact ABBYY to request a tenant" rather than at a signup. Access to the Vantage
  Processing and Reporting APIs requires a tenant that ABBYY provisions after a sales conversation; a
  developer cannot obtain credentials, a trial, or a published rate card without talking to a person.
  Third-party benchmarking sites quote per-page and annual-contract figures, but none of that is
  ABBYY-published and none of it is recorded here.
plans: []
note: >-
  This file previously carried a three-tier free/professional/enterprise scaffold written by the
  2026-05-04 bulk sweep with invented quotas and prices. Those tiers never existed. They are replaced here
  with the searched result: zero published plans.
access:
