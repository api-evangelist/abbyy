  request_url: https://www.abbyy.com/company/contact-us/
  trial: 'on request — "Request a trial tenant in ABBYY Vantage" routes to the same contact form'
  free_tier: false
  marketplace: https://www.abbyy.com/marketplace/
  marketplace_note: >-
    ABBYY Marketplace lists connectors and assets, some of them paid, but it does not price API access.
