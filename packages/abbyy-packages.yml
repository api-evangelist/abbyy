provider: ABBYY
providerId: abbyy
note: >-
  ABBYY's API landing page advertises SDKs in Python, C#, TypeScript and Java. Every one of those that is
  actually published targets ABBYY Document AI (base https://api.abbyy.com/document-ai), not the Vantage
  Processing/Reporting APIs this repo profiles. All four Document AI SDKs are Speakeasy-generated, still at
  0.x, and were last released on 2025-04-17 — and the host they call, api.abbyy.com, returned HTTP 530
  (Cloudflare origin unreachable) on every path probed on 2026-08-29. There is NO first-party client library
  for the ABBYY Vantage API on any public registry: ABBYY ships a Postman collection and RPA connectors
  instead. The remaining first-party packages are mobile-capture bindings, last shipped in 2021-2022.
